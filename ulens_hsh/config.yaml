# =========================
# CONFIGURACIÓN DEL PIPELINE
# =========================

night: "20250823bis"
filters: ["I", "V"]  # filtros a procesar
metadata:
  output_file: "images_data.csv"

paths:
  BASE: "/home/knowogrodski/Documentos/observation_HSH/ulens_hsh/ulens_hsh"
  data_dir: "data"           
  objects_dir: "objetos"
  objects_file: "objetos.csv"
  images_data_file: "images_data.csv"          


instrument:
  gain: 2.0
  rdnoise: 15.7

steps:
  update_headers: true
  export_metadata: true
  reduction: false
  astrometry: false
  contains_obj: false
  combine: false
  photometry: true
  cleanup: false
  plots: false

reduction:
  zero_correction: true
  flat_correction: true
  dark_correction: false   # aún no implementado

astrometry:
  method: "astrometrynet"
  api_key: "wuupmjpswkcbncws"   # para API externa
  overwrite: false

aligment: 
  catalog:
    use_catalogs: "all"  # "all" o lista de catálogos
    min_mag: 9
    max_mag: 12
    fov_frac: 0.3  # fracción del FOV para búsqueda de
    plot: true
    overwrite: true


combine:
  combine_method: "median"  # "average" o "median"
  reject_method: "minmax"   # "minmax" o "sigma"
  nlow: 1                    # para "minmax"
  nhigh: 1                   # para "minmax"
  sigma_low: 3.0             # para "sigma"
  sigma_high: 3.0            # para "sigma"
  remove_temp_files: true

photometry:
  catalog:
    use_catalogs: ["Gaia"]  # "all" o lista ["Gaia_phot", "APASS"]
    query_method: "gaia"  # "vizier" o "gaia" or "raw"
    gaia_to_vi: "ESA"   # "ESA" or "Tonry" (SN)
    min_mag: 9
    max_mag: 15
    max_mag_err: 0.25
    fov_frac: 0.3  # fracción del FOV para búsqueda de fuentes
    overwrite: true
    min_bp_snr: 50
    min_rp_snr: 50
    min_g_snr: 100
    row_limit: -1
  method: "aperture"  # "aperture" o "psf"
  aperture_radius: 5.0  # en píxeles
  annulus_inner_radius: 8.0  # en píxeles
  annulus_width: 5.0  # en píxeles



qc: # quality checks
  reduction_images: false
  combined_images: false